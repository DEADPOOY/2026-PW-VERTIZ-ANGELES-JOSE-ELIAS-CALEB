<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios con Node</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <p class="barra-navegacion">
            <a href="../../index.html">&larr; Volver al Portafolio</a>
        </p>
        <h1>Ejercicios con Node</h1>
    </header>

    <main>
        <section class="ejercicio">
            <h2>Arreglos <code>01-arreglos.js</code></h2>
            <p>Selecciona una operacion para ejecutar sobre el arreglo de talleres.</p>

            <div class="tabla-scroll">
                <table id="tabla-talleres">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Instructor</th>
                            <th>Cupo</th>
                            <th>Inscritos</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>

            <form id="formulario-arreglos" class="formulario">
                <div class="campos">
                    <label for="operacion-arreglo">Operacion</label>
                    <select name="operacion-arreglo" id="operacion-arreglo">
                        <option value="forEach">forEach - Lista simple</option>
                        <option value="map">map - Copia solo nombres</option>
                        <option value="filter">filter - Talleres con cupo lleno</option>
                        <option value="find">find - Buscar por nombre del instructor</option>
                        <option value="reduce">reduce - Total de inscritos</option>
                        <option value="disponibles">filter + map - Talleres con cupo disponible</option>
                    </select>
                </div>

                <button type="submit">Ejecutar</button>
            </form>

            <output class="resultado" id="resultado-arreglo" for="formulario-arreglos"></output>
        </section>

        <section class="ejercicio">
            <h2>Objetos <code>02-objetos-json.js</code></h2>
            <p>Selecciona un taller y una operacion para consultar sus propiedades.</p>

            <form id="formulario-objetos" class="formulario">
                <div class="campos">
                    <label for="taller-objeto">Taller</label>
                    <select name="taller-objeto" id="taller-objeto"></select>
                </div>
                <div class="campos">
                    <label for="operacion-objeto">Operacion</label>
                    <select name="operacion-objeto" id="operacion-objeto">
                        <option value="keys">Object.keys - Propiedades</option>
                        <option value="values">Object.values - Valores</option>
                        <option value="entries">Object.entries - Campos y valores</option>
                        <option value="gato">Ver gato bailando</option>
                    </select>
                </div>

                <button type="submit">Ejecutar</button>
            </form>

            <output class="resultado" id="resultado-objeto" for="formulario-objetos"></output>

            <div class="video-gato" id="contenedor-gato" hidden>
                <h3>Este es el gato bailando</h3>
                <video id="video-gato" class="video" controls loop muted playsinline>
                    <source src="videos/videoplayback.mp4" type="video/mp4">
                    Tu navegador no puede reproducir este video.
                </video>
            </div>
        </section>
    </main>

    <script src="js/01-arreglos.js"></script>
    <script src="js/02-objetos-json.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
