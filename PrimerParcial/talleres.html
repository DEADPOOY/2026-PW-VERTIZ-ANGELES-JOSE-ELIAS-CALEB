<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejercicios con node</title>
    <link rel="stylesheet" href="">
</head>
<body>
    <header><h1>ejercicios con node</h1></header>
    <main>
        <section class="ejercicio" >
            <h2 id = "tirulo-arreglos"> Arreglos del codigo <code>01-arreglos.js</code> </h2>
            <p>datos de prueba con js</p>
            <div class="tabla-scroll">
                <table id= "tabla-talleres">
                    <thead>
                        <tr>
                            <th>nombre</th>
                            <th>instructor</th>
                            <th>cupo</th>
                            <th>inscritos</th>
                        </tr>
                    </thead>
                    <tbody>
                            
                    </tbody>
                </table>
            </div>

            <form id="formulario-arreglos" class="formulario">
                <div class="campos">
                    <label for ="operacion-arreglo" name="operacion-arreglo"></label>
                    <select name="operacion-arreglo" id="operacion-arreglo">
                        <option value="ForEach">ForEach - lista simple</option>
                        <option value="map">map - copia solo nombres</option>
                        <option value="filter">filter - filtrar talleres con cupo lleno</option>
                        <option value="find">find - buscar por el nombre del instructor</option>
                    </select>
                </div>
                <button type="submit">ejecutar</button>

            </form>
            <output class="resultado" id="resultado de Arreglo" for="form-arreglo"></output>
        </section>
    </main>

    <scripts src="./02Ejercicios/app.js"></script>

</body>
</html>
